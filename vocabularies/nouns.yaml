nouns:
  fantasy:
    # Path B union with realm-sigil/words/realms.json as of 2026-05-07.
    description: Concrete fantasy nouns suitable for compound names
    words: [aegis, beacon, crown, dominion, echo, ember, forge, grimoire, herald, hollow, insignia, jewel, keystone, lantern, monolith, nexus, oracle, pinnacle, pulsar, quartz, raven, relic, sigil, throne, warden]
  fleet:
    # NODE IDENTITY — size-locked at 32. See docs/superpowers/design/node-identity-namespace.md
    #
    # ⚠️ Same locked-count rule as adjectives.fleet. Every word here is checked against
    # vocabularies/reserved.yaml: node identity must not reuse a role, frame, feature, tool or
    # version-namespace word. `crown` (gateway ROLE), `beacon` (a SMOLv1 FRAME), `forge` (the
    # VERSION-name realm), `herald`, `oracle` and `sigil` were all removed for that reason.
    # `hollow` is omitted here because it is also an adjective in this realm — "Hollow Hollow"
    # is a reachable roll.
    description: Node-identity nouns (fantasy voice, size-locked at 32 — do not resize)
    words: [aegis, bastion, brazier, cairn, chalice, citadel, diadem, dominion, echo, ember, glyph, grimoire, insignia, jewel, keystone, lantern, lodestar, monolith, nexus, obelisk, orrery, pinnacle, pulsar, quartz, raven, relic, sanctum, spire, talisman, throne, vigil, warden]
  creature:
    # THE FAMILIAR's creature names — a THIRD namespace (identity · provenance · creature).
    # NOT size-locked and deliberately NOT a power of two: the familiar seeds from a u32
    # (familiar/mod.rs:534), so the domain is ~2^32 and injectivity is IMPOSSIBLE, not merely
    # unneeded. 24x24 = 576 combos keeps a birthday collision across 10 concurrently-visible
    # creatures near 7.5%, and a collision is cosmetic — a creature is never an addressing key.
    # The REAL requirement is set disjointness: from reserved, and from fleet.
    description: Creature names for the Mesh Familiar (disjoint from fleet and reserved)
    words: [sprite, wisp, moth, finch, wren, newt, vole, hare, fawn, cub, kit, imp, pika, shrew, marten, otter, gecko, skink, drake, wyrmling, pixie, brownie, kelpie, faun]
  oracle:
    description: Nouns for prophecy, fate, and divination
    words: [oracle, augur, sibyl, prophet, omen, vision, harbinger, dreamer, seer, scrying, prophecy, runecast, soothsayer, divination]
  forge:
    description: Nouns for smithing, craft, and creation
    # `ember` REMOVED 2026-07-28: it collided with nouns.fleet, and forge names BUILDS while fleet
    # names BOARDS — one word doing both is the exact ambiguity the split exists to prevent.
    # Replaced (not dropped) so the list stays 14 and only this index's name shifts; `quench` is
    # already in smol's pinned forge table, so this moves upstream TOWARD it rather than further away.
    words: [forge, anvil, kiln, quench, hammer, smithy, smelter, ironheart, wright, crucible, bellows, mold, ingot, foundry]
  signal:
    # Path B union with realm-sigil/words/realms.json as of 2026-05-07.
    description: Nouns for networking, electromagnetic, and data-flow imagery
    words: [antenna, beacon, broadcast, carrier, channel, diode, emitter, frequency, gate, harbor, harmonic, impulse, junction, keystone, lattice, lighthouse, link, modem, node, oscillator, packet, ping, pulsar, pulse, qubit, relay, semaphore, signal, telegraph, transponder]
  void:
    description: Nouns for cosmic emptiness, entropy, and shadow
    words: [abyss, hollow, eclipse, drift, hush, shroud, silence, chasm, umbra, threshold, rift, cipher, vanishment, absence]
  stellar:
    description: Nouns for stars, planets, and astronomy
    words: [nova, quasar, nebula, comet, orbit, solstice, zenith, meridian, constellation, supernova, parallax, lensing, perihelion, eclipse]
  tarot:
    description: Nouns for tarot archetypes and arcana
    words: [arcana, fool, hierophant, hanged, tower, star, sun, moon, judgement, world, wheel, chariot, hermit, magician]
  any:
    description: Generic nouns for branch/agent rolls
    words: [roster, forge, echo, beacon, harbor, signal, lantern, anchor, pillar, channel]
