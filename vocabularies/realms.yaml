# Themed realms. Each realm provides flavoring for project names and entity rolls.
# Source of truth — realm-sigil consumes this file once v1.0 ships (sync-vocabularies.sh).
#
# Sigil cutover decision (JP, 2026-05-07):
#   - fantasy, signal: Path B — grow lexicon's lists to cover sigil's existing
#     corpus before cutover, so sigil's user-visible names don't churn.
#   - oracle, forge, void, stellar, tarot: Path A — adopt lexicon as-is. These
#     realms have no public history in sigil yet, so churn is harmless.
# See docs/superpowers/specs/2026-05-07-sigil-cutover-design.md.
realms:
  fantasy:
    description: High-fantasy Tolkienesque vocabulary
    words: [primal, shadow, ember, runic, moonlit, ravenforge, brimwarden, hollow, mistveil, oakheart]
  tarot:
    description: Tarot-card archetypes and arcana
    words: [arcana, fool, hierophant, hanged, tower, star, sun, moon, judgement, world]
  oracle:
    description: Prophecy, fate, and divination imagery
    words: [oracle, augur, sibyl, prophet, dreamer, harbinger, omen, vision, fate, sigil]
  void:
    description: Cosmic emptiness, entropy, and shadow
    words: [void, abyss, hollow, eclipse, "null", drift, silent, unmade, hush, shroud]
  forge:
    description: Smithing, craft, and creation
    words: [forge, anvil, kiln, ember, smelter, ironheart, hammer, mold, wright, smithy]
  signal:
    description: Networking, electromagnetic, and data-flow imagery
    words: [pulsar, beacon, qubit, relay, packet, lighthouse, antenna, ping, telegraph, semaphore]
  stellar:
    description: Stars, planets, and astronomy
    words: [stellar, nova, pulsar, quasar, nebula, comet, orbit, lunar, solstice, zenith]
