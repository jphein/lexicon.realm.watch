<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- open book with a small rune sigil hovering above -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e3c4"/>
      <stop offset="1" stop-color="#cdb88a"/>
    </linearGradient>
  </defs>
  <!-- spine shadow -->
  <path d="M50 38 L50 86" stroke="#3a2a18" stroke-width="2" stroke-linecap="round"/>
  <!-- left page -->
  <path d="M14 40 Q32 36 50 40 L50 84 Q32 80 14 84 Z"
        fill="url(#page)" stroke="#7a5a30" stroke-width="2" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M86 40 Q68 36 50 40 L50 84 Q68 80 86 84 Z"
        fill="url(#page)" stroke="#7a5a30" stroke-width="2" stroke-linejoin="round"/>
  <!-- text lines -->
  <g stroke="#7a5a30" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <line x1="20" y1="50" x2="44" y2="50"/>
    <line x1="20" y1="56" x2="42" y2="56"/>
    <line x1="20" y1="62" x2="44" y2="62"/>
    <line x1="20" y1="68" x2="40" y2="68"/>
    <line x1="56" y1="50" x2="80" y2="50"/>
    <line x1="56" y1="56" x2="78" y2="56"/>
    <line x1="56" y1="62" x2="80" y2="62"/>
    <line x1="56" y1="68" x2="76" y2="68"/>
  </g>
  <!-- floating rune sigil -->
  <g stroke="#c8aa5a" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="50" cy="20" r="8" opacity="0.85"/>
    <line x1="50" y1="13" x2="50" y2="27"/>
    <line x1="44" y1="20" x2="56" y2="20"/>
  </g>
</svg>
