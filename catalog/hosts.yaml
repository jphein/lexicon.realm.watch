# ⚠️ THIS IS NOT THE HOST REGISTRY. Do not add hosts here.
#
# `fleet.yaml` in realmwatch is identity-of-record for all nodes. That is stated
# in realmwatch/CLAUDE.md, and it is where all ~126 hosts actually live, with a
# design spec, load-time validation, a rename/replace lifecycle, and a Python
# library (lexicon.FleetCatalog, python/lexicon/fleet.py) that reads it. Nothing
# reads THIS file — not the Go binary, not the Python package, nothing.
#
# History, so nobody re-derives it: this file was created 2026-05-12 for
# east-tree-trunk. Seven days later that same switch triggered the fleet-catalog
# design (realmwatch/docs/superpowers/specs/2026-05-18-lexicon-fleet-catalog-design.md),
# which concluded a different file should own node identity. This file was
# superseded almost immediately and never updated. Its original header promised
# the schema would "harden once a second entry lands" — the second entry never
# landed here because all 125 subsequent hosts went to fleet.yaml instead. Read
# that promise as a stale note, not an invitation.
#
# The two records of east-tree-trunk have already drifted apart: this one and the
# fleet.yaml one disagree on the rename date and the realm. One host, two records,
# already inconsistent — which is the argument against adding a second host here.
#
# What remains: a single externally co-managed device. The stewardship fields it
# carries (contacts, audience, location, os, mgmt_ip) were the one thing fleet.yaml
# did not model; they have since been added to FleetEntry, so this file has no
# unique capability left. It is kept rather than deleted because deleting JP's
# only record of a shared device is his call, not a cleanup.
#
# New hosts go in fleet.yaml. Cameras, switches, APs, everything.

hosts:
  - id: east-tree-trunk
    current_name: east-tree-trunk
    kind: switch
    realm: signal
    audience: treelink
    mgmt_ip: 10.37.5.2
    vlan: 37
    model: Netgear GS308T v1 (Realtek RTL8380M rev C)
    os: OpenWrt 25.12.x (realtek/rtl838x)
    location: east — Treelink office
    contacts:
      - jp@jphein.com
      - thomas@treelink.us
    created: 2026-05-12
    prior_names:
      - name: gst308t-office
        retired: 2026-05-12
    status: active
    notes: |
      Treelink-side switch JP co-manages with Thomas — not a homelab device.
      Plugged in "off lan8" of the deployed GS308T (10.0.6.110), sharing the
      ISP shared-L2 segment for its uplink. Independent gateway/DNS at
      10.37.0.1 (Treelink), L3-isolated from homelab VLANs (no gatekeeper
      route to VID 37). Reachable from katana via enp5s0.37/10.37.5.1; from
      wakizashi only via ProxyJump through katana. See memory
      east_tree_trunk.md for full access matrix.
